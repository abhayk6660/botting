services:
  - type: web
    name: gw-join-bot
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: DISCORD_TOKENS
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: TRIVIA_MODE
        value: s
      - key: MIN_TRIVIA_DELAY
        value: "3500"
      - key: MAX_TRIVIA_DELAY
        value: "6500"
      - key: MINIGAME_ONLY
        value: y
      - key: CHAT_MODE
        value: s
